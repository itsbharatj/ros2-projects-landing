<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The ROS 2 cheat sheet</title>
<meta name="description" content="A two-page, printable ROS 2 cheat sheet by Bharat Jain: the ideas, the everyday commands, one complete node, how to move a robot, the six-project roadmap and every link from the article. Free. Leave your name and email, download it straight away, and tick a box if you want to hear about the free live workshop.">
<meta property="og:title" content="The ROS 2 cheat sheet">
<meta property="og:description" content="Two printable pages with everything you need to start building robots with ROS 2. Free, by Bharat Jain.">
<meta property="og:image" content="https://ros2-projects-landing.vercel.app/assets/cheatsheet-p1.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%234556ff'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/Fraunces.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="screen">
  <header class="top">
    <a class="who" href="https://x.com/BharatJain8873" data-link="x">
      <img src="assets/bharat.jpg" alt="" width="32" height="32">
      <span>Bharat Jain</span>
    </a>
    <nav aria-label="Links">
      <a href="https://x.com/BharatJain8873" data-link="article">The article</a>
      <a href="https://www.youtube.com/" data-link="youtube">YouTube</a>
      <a href="https://github.com/itsbharatj" data-link="github">GitHub</a>
    </nav>
  </header>

  <section class="say">
    <h1>The ROS 2 cheat sheet</h1>
    <p class="lead">24 ROS&nbsp;2 projects in 11 months, from zero. This is the two-page sheet I wish I had on day one. <b>Free.</b></p>

    <figure class="sheet">
      <a href="assets/cheatsheet-p1.jpg" target="_blank" rel="noopener" title="Open page 1 at full size">
        <img src="assets/cheatsheet-p1.jpg" alt="Page one of the cheat sheet: the ideas, the everyday commands, one complete node, moving a robot, and the messages you will meet." width="1600" height="1131">
      </a>
      <figcaption>Page 1 of 2</figcaption>
    </figure>
  </section>

  <section class="ask" aria-live="polite">
    <form id="signup" novalidate>
      <h2>Get the PDF</h2>

      <label class="field">
        <span class="label">Name</span>
        <input name="name" type="text" autocomplete="name" required maxlength="80">
      </label>

      <label class="field">
        <span class="label">Email</span>
        <input name="email" type="email" autocomplete="email" inputmode="email" required maxlength="254">
      </label>

      <fieldset class="field">
        <legend class="label">ROS&nbsp;2 experience</legend>
        <div class="choices">
          <label><input type="radio" name="experience" value="new" checked><span>None yet</span></label>
          <label><input type="radio" name="experience" value="tutorials"><span>The tutorials</span></label>
          <label><input type="radio" name="experience" value="project"><span>A project or two</span></label>
          <label><input type="radio" name="experience" value="work"><span>I use it at work</span></label>
        </div>
      </fieldset>

      <label class="check">
        <input type="checkbox" name="workshop" value="yes">
        <span><b>I want the free live ROS&nbsp;2 workshop</b><small class="sub">5 days · 10 people · runs once 10 sign up</small></span>
      </label>

      <!-- bots fill this in; people never see it -->
      <div class="hp" aria-hidden="true"><label>Website <input name="website" type="text" tabindex="-1" autocomplete="off"></label></div>

      <p class="error" id="form-error" role="alert" hidden></p>
      <button type="submit" id="submit">Get the cheat sheet</button>
      <p class="fine">Private. No newsletter.</p>
    </form>

    <div id="done" class="done" hidden tabindex="-1">
      <h2 id="done-title">Thanks. Here is your sheet.</h2>
      <p id="done-note"></p>
      <a id="download" class="button" href="assets/ros2-cheatsheet.pdf" download="ros2-cheatsheet.pdf">Download the PDF</a>
      <p class="fine" id="done-fine"></p>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
